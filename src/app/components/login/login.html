<div class="parent">
<div class="wrapper">
    <form >
        <h1>Login</h1>
        
        <div class="input-box">
            <input type="text" name="username" [(ngModel)]="loginObj.username" placeholder="username" >
            
        </div>
        <div class="input-box">
            <input type="password" name="password" [(ngModel)]="loginObj.password" placeholder="password" >
            
            
        </div>
        <div class="remember-forgot">
            <label> <input type="checkbox">Remember me</label>
            <a href="#">Forget password?</a>
        </div>
        <button type="submit" class="btn"(click)="Onlogin()">Submit</button>
        <div class="register-link">
            <p>Don't have an account?<a href="#">Register</a></p>
        </div>
    </form>
</div>
</div>
